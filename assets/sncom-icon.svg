<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="globeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- 整个图标就是终端外框 -->
  <rect x="8" y="8" width="496" height="496" rx="64"
        fill="url(#bg)" stroke="#38bdf8" stroke-width="6"/>

  <!-- 地球：半径 158，位置略微上移，底部坐标维持 352 -->
  <circle cx="256" cy="194" r="158" fill="url(#globeFill)"/>
  <g stroke="#e0f2fe" stroke-width="8" fill="none" opacity="0.9">
    <ellipse cx="256" cy="194" rx="158" ry="62"/>
    <ellipse cx="256" cy="194" rx="158" ry="122"/>
    <ellipse cx="256" cy="194" rx="63" ry="158"/>
    <ellipse cx="256" cy="194" rx="123" ry="158"/>
  </g>
  <circle cx="256" cy="194" r="158" fill="none" stroke="#e0f2fe" stroke-width="9"/>

  <!-- ================= 底部整体包裹边框 ================= -->
  <!-- 边框整体放大，线条加粗至 6，圆角增大至 20 -->
  <rect x="136" y="364" width="240" height="100" rx="20"
        fill="none" stroke="#ffffff" stroke-width="6" />

  <g>
    <!-- 左侧终端提示符 >_：浅红色 -->
    <path d="M166 389 L196 414 L166 439" fill="none" stroke="#f87171"
          stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M204 439 H234" fill="none" stroke="#f87171"
          stroke-width="12" stroke-linecap="round"/>

    <!-- 右侧 TX 发送箭头：绿色 -->
    <path d="M278 389 H346" stroke="#4ade80" stroke-width="10" stroke-linecap="round"/>
    <path d="M346 389 L334 379 M346 389 L334 399" stroke="#4ade80"
          stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 右侧 RX 接收箭头：青色 -->
    <path d="M346 439 H278" stroke="#22d3ee" stroke-width="10" stroke-linecap="round"/>
    <path d="M278 439 L290 429 M278 439 L290 449" stroke="#22d3ee"
          stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
